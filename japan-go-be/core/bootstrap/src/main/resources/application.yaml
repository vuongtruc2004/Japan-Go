server:
  port: 8000
  tomcat:
    max-part-count: 100

spring:
  application:
    name: japan-go-be

  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  data:
    redis:
      timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2s

    web:
      pageable:
        one-indexed-parameters: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 1000
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  messages:
    basename: i18n/messages
    encoding: UTF-8

mybatis:
  mapper-locations: classpath*:/mybatis/mapper/**/*.xml
  type-aliases-package: org.japan.entity
